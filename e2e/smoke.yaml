appId: com.khavion.deendawn
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: 'prayer-row-fajr'
    timeout: 20000
- takeScreenshot: ${SCREENS_DIR}/smoke-today
# Assert on setting-language: always above the fold on both platforms
# (setting-method sits below the fold on taller Android screens).
- tapOn: ${TAB_MORE}
- extendedWaitUntil:
    visible:
      id: 'setting-language'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'notif-fajr'
    direction: DOWN
    centerElement: true
- takeScreenshot: ${SCREENS_DIR}/smoke-more
- tapOn: ${TAB_QURAN}
- extendedWaitUntil:
    visible:
      id: 'quran-search'
    timeout: 10000
- takeScreenshot: ${SCREENS_DIR}/smoke-quran-list
- tapOn:
    id: 'surah-1'
- extendedWaitUntil:
    visible:
      id: 'ayah-1-1'
    timeout: 10000
- takeScreenshot: ${SCREENS_DIR}/smoke-surah
