appId: com.khavion.deendawn
---
# First-run onboarding: welcome -> city -> notifications -> Today.
# Requires a fresh data container (clearState) so 'onboarded.v1' is unset.
- launchApp:
    stopApp: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'ob-begin'
    timeout: 30000
- takeScreenshot: ${SCREENS_DIR}/onboarding-welcome
- tapOn:
    id: 'ob-begin'
- extendedWaitUntil:
    visible:
      id: 'ob-city'
    timeout: 10000
- takeScreenshot: ${SCREENS_DIR}/onboarding-city
- tapOn:
    id: 'ob-city'
- extendedWaitUntil:
    visible:
      id: 'city-search'
    timeout: 10000
- tapOn:
    id: 'city-search'
- inputText: 'Houston'
# The city search is debounced (150ms); tapping before the results settle
# races the FlashList re-render and the tap is dropped.
- extendedWaitUntil:
    visible:
      id: 'city-houston-us'
    timeout: 5000
- waitForAnimationToEnd
# Cross-platform: the return key selects the top match — a real affordance the
# picker supports (commit 0b27cb1). It also dodges the iOS 26 native-pageSheet
# tap-offset bug (Maestro/XCUITest taps land offset inside the sheet).
- pressKey: Enter
# Step 2 now shows the live times preview; Continue advances to step 3.
- extendedWaitUntil:
    visible:
      id: 'ob-city-next'
    timeout: 10000
- tapOn:
    id: 'ob-city-next'
- extendedWaitUntil:
    visible:
      id: 'ob-reminders'
    timeout: 10000
- takeScreenshot: ${SCREENS_DIR}/onboarding-notifications
# Choose "No notifications" then Finish (radio + button since the restyle).
- tapOn:
    id: 'ob-skip'
- tapOn:
    id: 'ob-finish'
- extendedWaitUntil:
    visible:
      id: 'prayer-row-fajr'
    timeout: 20000
- takeScreenshot: ${SCREENS_DIR}/onboarding-done-today
# Relaunch (no clearState): onboarding must NOT reappear.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: 'prayer-row-fajr'
    timeout: 20000
- assertNotVisible:
    id: 'ob-begin'
