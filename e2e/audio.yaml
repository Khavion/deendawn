appId: com.khavion.deendawn
---
# Streaming player against the dev tone server (scripts/dev-audio-server.mjs
# must be running on :8083). DEV BUILDS ONLY — the badge and localhost source
# exist only there. On Android the emulator cannot reach the host's localhost:
# the driver must run `adb reverse tcp:8083 tcp:8083` first
# (scripts/e2e-android.sh does both). Verifies play, progress, pause, and the
# honest placeholder badge.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: 'prayer-row-fajr'
    timeout: 20000
- tapOn: ${TAB_QURAN}
- extendedWaitUntil:
    visible:
      id: 'quran-search'
    timeout: 10000
- tapOn:
    id: 'surah-2'
- extendedWaitUntil:
    visible:
      id: 'surah-audio-bar'
    timeout: 10000
- assertVisible:
    text: 'DEV audio.*'
- tapOn:
    id: 'listen-bar-toggle'
# Let it stream a few seconds, then the progress readout should show a clock.
# (App-formatted mm:ss text, not a platform locale string; EN cells only.)
- extendedWaitUntil:
    visible:
      text: '0:0.*/.*1:00.*'
    timeout: 15000
- takeScreenshot: ${SCREENS_DIR}/audio-playing
- tapOn:
    id: 'listen-bar-toggle'
- takeScreenshot: ${SCREENS_DIR}/audio-paused
