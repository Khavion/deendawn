appId: com.khavion.deendawn
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: 'prayer-row-fajr'
    timeout: 20000
- tapOn: ${TAB_ASK}
- extendedWaitUntil:
    visible:
      id: 'ask-input'
    timeout: 10000
- tapOn:
    id: 'ask-input'
- inputText: 'How many verses mention patience?'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'ask-count'
    timeout: 10000
- takeScreenshot: ${SCREENS_DIR}/ask-count
- tapOn:
    id: 'ask-input'
- eraseText
- inputText: 'Is music halal?'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'ask-redirect'
    timeout: 10000
- takeScreenshot: ${SCREENS_DIR}/ask-redirect
# Cross-source: switch to Books, search, expect section results deep-linkable
- tapOn:
    id: 'ask-source-library'
- tapOn:
    id: 'ask-input'
- eraseText
- inputText: 'knowledge of the soul'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'ask-sections'
    timeout: 10000
- takeScreenshot: ${SCREENS_DIR}/ask-library
# Ruling redirect applies to books too
- tapOn:
    id: 'ask-input'
- eraseText
- inputText: 'Is music halal?'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'ask-redirect-library'
    timeout: 10000
